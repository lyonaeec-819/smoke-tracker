<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>控烟记录 - 生存模式</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364 ); color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; box-sizing: border-box; }
        .timer-title { font-size: 14px; color: #a0aec0; margin-bottom: 8px; display: flex; justify-content: center; gap: 8px; }
        .edit-icon { cursor: pointer; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 10px; }
        .timer-display { font-size: 36px; font-weight: bold; color: #00e676; text-shadow: 0 0 15px rgba(0,230,118,0.5); margin-bottom: 15px; }
        .count-display { font-size: 60px; font-weight: bold; margin: 10px 0; color: #fff; }
        .count-total { font-size: 24px; color: #718096; }
        .btn { color: white; border: none; border-radius: 50px; padding: 18px 40px; font-size: 20px; font-weight: bold; width: 100%; margin-top: 25px; cursor: pointer; }
        .btn-add { background: linear-gradient(45deg, #ff416c, #ff4b2b); box-shadow: 0 8px 20px rgba(255,75,43,0.4); }
        .btn-new { background: linear-gradient(45deg, #11998e, #38ef7d); box-shadow: 0 8px 20px rgba(56,239,125,0.4); display: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .btn-undo { background: none; border: none; color: #718096; margin-top: 15px; text-decoration: underline; cursor: pointer; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 25px; }
        .box { width: 28px; height: 28px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .box.skull { background: rgba(255,75,43,0.15); border-color: rgba(255,75,43,0.3); }
        .history-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 14px; border-radius: 12px; width: 100%; max-width: 400px; cursor: pointer; margin-bottom: 10px; }
        .history-container { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; display: none; padding-bottom: 10px; }
        .chart-wrapper { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .h-item { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; text-align: left; }
        .h-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .h-date { color: #a0aec0; font-size: 12px; }
        .green { color: #00e676; } .red { color: #ff4b2b; }
        .toast { position: fixed; bottom: 80px; background: rgba(255,255,255,0.9); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 3000; }
        .toast.show { opacity: 1; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .m-content { background: #203a43; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; border: 1px solid rgba(255,255,255,0.1); }
        .m-content h3 { margin-top: 0; color: #fff; }
        .m-group { text-align: left; margin-bottom: 15px; }
        .m-group label { display: block; color: #a0aec0; font-size: 14px; margin-bottom: 5px; }
        .m-content input { width: 100%; padding: 12px; border-radius: 10px; border: none; box-sizing: border-box; }
        .m-btns { display: flex; gap: 15px; margin-top: 25px; }
        .m-btns button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="timer-title">⚡ 当前这包烟已存活 ⚡ <span class="edit-icon" onclick="openModal()">✏️ 修改时间</span></div>
        <div id="timerDisplay" class="timer-display">00:00:00</div>
        <div class="count-display"><span id="countDisplay">0</span><span class="count-total"> / 20</span></div>
        <button id="btnAdd" class="btn btn-add" onclick="addSmoke()">记录一支 🚬</button>
        <button id="btnNew" class="btn btn-new" onclick="startNewPack()">🎉 开启新一包</button>
        <button class="btn-undo" onclick="undoSmoke()">点错了，撤销</button>
        <div id="grid" class="grid"></div>
    </div>
    <button class="history-btn" onclick="toggleHistory()">📊 查看战绩 (存活时间对比)</button>
    <div class="history-container" id="historyContainer">
        <div class="chart-wrapper"><canvas id="trendChart"></canvas></div>
        <div id="historyList"></div>
    </div>
    <div id="toast" class="toast"></div>
    <div id="modal" class="modal">
        <div class="m-content">
            <h3>修改本包时间</h3>
            <div class="m-group"><label>开启时间：</label><input type="datetime-local" id="inStart"></div>
            <div class="m-group" id="endGroup" style="display:none"><label>抽完时间：</label><input type="datetime-local" id="inEnd"></div>
            <div class="m-btns">
                <button style="background:rgba(255,255,255,0.1);color:#fff" onclick="closeModal()">取消</button>
                <button style="background:#00e676;color:#000" onclick="saveTimes()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let chart=null, toastTimer=null;
        Chart.defaults.color='#a0aec0'; Chart.defaults.borderColor='rgba(255,255,255,0.05)';

        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
            if(toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        if(!localStorage.getItem('pStart')) { localStorage.setItem('pStart', Date.now()); localStorage.setItem('pCount', 0); }

        function getData() {
            return {
                start: parseInt(localStorage.getItem('pStart')),
                count: parseInt(localStorage.getItem('pCount')) || 0,
                end: localStorage.getItem('pEnd') ? parseInt(localStorage.getItem('pEnd')) : null
            };
        }

        function getHist() { return JSON.parse(localStorage.getItem('pHist') || '[]'); }

        function fmtDur(ms) {
            if(ms<0) ms=0;
            const m = Math.floor(ms/60000), d = Math.floor(m/1440), h = Math.floor((m%1440)/60), min = m%60;
            if(d>0) return `${d}天 ${h}小时 ${min}分`;
            if(h>0) return `${h}小时 ${min}分`;
            return `${min}分钟`;
        }

        function fmtDate(ts) {
            const d = new Date(ts);
            return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function updateTimer() {
            const data = getData();
            const diff = (data.end || Date.now()) - data.start;
            document.getElementById('timerDisplay').innerText = fmtDur(diff);
        }

        function openModal() {
            const data = getData();
            const dStart = new Date(data.start);
            const tz = dStart.getTimezoneOffset() * 60000;
            document.getElementById('inStart').value = (new Date(dStart - tz)).toISOString().slice(0, 16);
            
            const endGroup = document.getElementById('endGroup');
            if(data.count >= 20 && data.end) {
                endGroup.style.display = 'block';
                document.getElementById('inEnd').value = (new Date(new Date(data.end) - tz)).toISOString().slice(0, 16);
            } else {
                endGroup.style.display = 'none';
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveTimes() {
            const data = getData();
            const startVal = document.getElementById('inStart').value;
            if(!startVal) return;
            const nStart = new Date(startVal).getTime();
            if(nStart > Date.now()) { showToast("开启时间不能在未来！"); return; }
            
            if(data.count >= 20 && data.end) {
                const endVal = document.getElementById('inEnd').value;
                if(!endVal) return;
                const nEnd = new Date(endVal).getTime();
                if(nEnd > Date.now()) { showToast("抽完时间不能在未来！"); return; }
                if(nEnd < nStart) { showToast("抽完时间不能早于开启时间！"); return; }
                localStorage.setItem('pEnd', nEnd);
            }
            
            localStorage.setItem('pStart', nStart);
            closeModal(); updateUI(); showToast("时间已成功修改！");
        }

        function addSmoke() {
            let data = getData();
            if(data.count < 20) {
                data.count++; localStorage.setItem('pCount', data.count);
                if(data.count === 20) { localStorage.setItem('pEnd', Date.now()); showToast("这包烟抽完了！"); } 
                else { showToast(`本包第 ${data.count} 支`); }
                updateUI();
            }
        }

        function undoSmoke() {
            let data = getData();
            if(data.count > 0) {
                if(data.count === 20) localStorage.removeItem('pEnd');
                data.count--; localStorage.setItem('pCount', data.count);
                showToast(`已撤销，当前 ${data.count} 支`); updateUI();
            }
        }

        function startNewPack() {
            let data = getData(), hist = getHist();
            const endTime = data.end || Date.now();
            hist.push({
                num: hist.length + 1, start: data.start, end: endTime,
                hrs: parseFloat(((endTime - data.start) / 3600000).toFixed(1)),
                txt: fmtDur(endTime - data.start)
            });
            localStorage.setItem('pHist', JSON.stringify(hist));
            localStorage.setItem('pStart', Date.now());
            localStorage.setItem('pCount', 0);
            localStorage.removeItem('pEnd');
            showToast("新的一包开始了，挑战新纪录！"); updateUI();
            if(document.getElementById('historyContainer').style.display === 'block') renderHist();
        }

        function updateUI() {
            const data = getData();
            document.getElementById('countDisplay').innerText = data.count;
            document.getElementById('btnAdd').style.display = data.count >= 20 ? 'none' : 'block';
            document.getElementById('btnNew').style.display = data.count >= 20 ? 'block' : 'none';
            
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            for(let i=0; i<20; i++) {
                const box = document.createElement('div');
                if(i < data.count) { box.className = 'box skull'; box.innerText = '💀'; } 
                else { box.className = 'box'; box.innerText = '👤'; }
                grid.appendChild(box);
            }
            updateTimer();
        }

        function toggleHistory() {
            const c = document.getElementById('historyContainer');
            c.style.display = c.style.display === 'block' ? 'none' : 'block';
            if(c.style.display === 'block') renderHist();
        }

        function renderHist() {
            const hist = getHist(), list = document.getElementById('historyList');
            if(hist.length === 0) { list.innerHTML = '<div class="h-item" style="text-align:center; color:#718096;">暂无战绩，抽完第一包后解锁</div>'; return; }
            
            const recent = hist.slice(-20), labels = recent.map(h => `第${h.num}包`), data = recent.map(h => h.hrs);
            const bgColors = data.map(h => h >= 24 ? '#00e676' : '#ff4b2b');

            const ctx = document.getElementById('trendChart').getContext('2d');
            if(chart) { chart.data.labels = labels; chart.data.datasets[0].data = data; chart.data.datasets[0].backgroundColor = bgColors; chart.update(); } 
            else {
                chart = new Chart(ctx, {
                    type: 'bar', data: { labels, datasets: [{ label: '存活时间(小时)', data, backgroundColor: bgColors, borderRadius: 4 }] },
                    options: { responsive: true, scales: { y: { beginAtZero: true, title: { display: true, text: '坚持小时数 (越高越好)' } } }, plugins: { legend: { display: false } } }
                });
            }

            list.innerHTML = '';
            [...hist].reverse().forEach(h => {
                const isG = h.hrs >= 24, color = isG ? 'green' : 'red', icon = isG ? '🏆' : '💀';
                list.innerHTML += `<div class="h-item">
                    <div class="h-header"><span style="font-weight:bold; color:#fff;">第 ${h.num} 包 ${icon}</span><span style="font-weight:bold;" class="${color}">${h.txt}</span></div>
                    <div class="h-date">起: ${fmtDate(h.start)} &nbsp;|&nbsp; 止: ${fmtDate(h.end)}</div>
                </div>`;
            });
        }

        updateUI();
        setInterval(updateTimer, 60000);
        document.addEventListener("visibilitychange", () => { if(!document.hidden) { updateUI(); if(document.getElementById('historyContainer').style.display === 'block') renderHist(); } });
    </script>
</body>
</html>
