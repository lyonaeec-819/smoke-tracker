<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>控烟记录</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05 );
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .status-icon { font-size: 60px; margin-bottom: 10px; }
        .count-display { font-size: 90px; font-weight: bold; margin: 10px 0; line-height: 1; }
        .green { color: #4CAF50; }
        .red { color: #F44336; }
        .info { margin-top: 10px; font-size: 14px; color: #888; }
        
        .btn-add {
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            width: 100%;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            transition: transform 0.1s;
        }
        .btn-add:active { transform: scale(0.95); }
        
        .btn-undo {
            background: none;
            border: none;
            color: #aaa;
            margin-top: 15px;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
            padding: 10px;
        }

        /* 健康小人网格样式 */
        .health-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 25px;
            width: 100%;
            max-width: 320px;
        }
        .health-box {
            width: 28px;
            height: 28px;
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .health-box svg {
            width: 18px;
            height: 18px;
        }

        .history-btn {
            background-color: #fff;
            border: 1px solid #ddd;
            color: #555;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .history-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            padding-bottom: 10px;
        }
        .chart-wrapper {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #f9f9f9;
            font-size: 15px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { color: #555; }
        .history-val { font-weight: bold; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="card">
        <div id="statusIcon" class="status-icon">✅</div>
        <div id="countDisplay" class="count-display green">0</div>
        <div class="info">每日限额 20 支  
(每晚 19:00 自动开启新一轮)</div>
        
        <button class="btn-add" onclick="addSmoke()">记录一支 🚬</button>
        <button class="btn-undo" onclick="undoSmoke()">点错了，撤销</button>

        <!-- 健康小人网格容器 -->
        <div id="healthGrid" class="health-grid"></div>
    </div>

    <button class="history-btn" onclick="toggleHistory()">📊 查看数据统计 (近30天图表)</button>
    
    <div class="history-container" id="historyContainer">
        <div class="chart-wrapper">
            <canvas id="trendChart"></canvas>
        </div>
        <div id="historyList"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let trendChart = null;
        let toastTimeout = null;

        // 灰色健康小人的 SVG 图标
        const personSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="#b0bec5"><path d="M112 48a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm40 304V480c0 17.7-14.3 32-32 32s-32-14.3-32-32V256.9L59.4 304.5c-9.1 15.1-28.8 20-43.9 10.9s-20-28.8-10.9-43.9l58.3-97c17.4-28.9 48.6-46.6 82.3-46.6h29.7c33.7 0 64.9 17.7 82.3 46.6l58.3 97c9.1 15.1 4.2 34.8-10.9 43.9s-34.8 4.2-43.9-10.9L232 256.9V480c0 17.7-14.3 32-32 32s-32-14.3-32-32V352H152z"/></svg>`;
        // 红色骷髅的 SVG 图标
        const skullSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="#F44336"><path d="M439.2 233.7c-10.9-89.1-83.6-158.5-172.5-168.6C165.2 53.8 75.6 124.6 64.8 225.5c-2.3 21.4-1.2 42.6 3.2 63.3l-1.9 1.9c-16.4 16.4-22.3 40.5-15.1 62.3l12.8 38.4c5.9 17.6 22.3 29.3 40.8 29.3H128v16c0 17.7 14.3 32 32 32h16c17.7 0 32-14.3 32-32v-16h32v16c0 17.7 14.3 32 32 32h16c17.7 0 32-14.3 32-32v-16h23.4c18.5 0 34.9-11.7 40.8-29.3l12.8-38.4c7.2-21.8 1.3-45.9-15.1-62.3l-1.9-1.9c4.4-20.7 5.5-41.9 3.2-63.3zM208 208c0-17.7 14.3-32 32-32s32 14.3 32 32-14.3 32-32 32-32-14.3-32-32zm-96 0c0-17.7 14.3-32 32-32s32 14.3 32 32-14.3 32-32 32-32-14.3-32-32z"/></svg>`;

        function showToast(message ) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        function getSmokingDay() {
            const now = new Date();
            if (now.getHours() < 19) now.setDate(now.getDate() - 1);
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function getHistoryData() {
            const data = localStorage.getItem('smokeHistoryData');
            return data ? JSON.parse(data) : {};
        }

        function saveHistoryData(data) {
            localStorage.setItem('smokeHistoryData', JSON.stringify(data));
        }

        function initPastSuccessRecords() {
            const data = getHistoryData();
            let modified = false;
            const pastRecords = { "2026-06-06": 20, "2026-06-07": 20, "2026-06-08": 20 };
            for (let date in pastRecords) {
                if (data[date] === undefined) {
                    data[date] = pastRecords[date];
                    modified = true;
                }
            }
            if (modified) saveHistoryData(data);
        }

        function getTodayCount() {
            const today = getSmokingDay();
            const data = getHistoryData();
            return data[today] || 0;
        }

        function addSmoke() {
            const today = getSmokingDay();
            const data = getHistoryData();
            data[today] = (data[today] || 0) + 1;
            saveHistoryData(data);
            updateUI();
            showToast(`今天已抽了 ${data[today]} 支`);
            if (document.getElementById('historyContainer').style.display === 'block') renderHistory();
        }

        function undoSmoke() {
            const today = getSmokingDay();
            const data = getHistoryData();
            if (data[today] && data[today] > 0) {
                data[today]--;
                saveHistoryData(data);
                updateUI();
                showToast(`已撤销，当前 ${data[today]} 支`);
                if (document.getElementById('historyContainer').style.display === 'block') renderHistory();
            }
        }

        // 渲染 20 个健康小人/骷髅网格
        function renderHealthGrid(count) {
            const grid = document.getElementById('healthGrid');
            grid.innerHTML = ''; // 清空网格
            
            // 固定生成 20 个格子
            for (let i = 0; i < 20; i++) {
                const box = document.createElement('div');
                box.className = 'health-box';
                
                // 如果当前的格子索引小于抽烟数量，就显示骷髅
                if (i < count) {
                    box.innerHTML = skullSVG;
                    box.style.backgroundColor = '#ffebee'; // 浅红色背景
                    box.style.borderColor = '#ffcdd2';     // 浅红色边框
                } else {
                    // 否则显示健康小人
                    box.innerHTML = personSVG;
                }
                
                grid.appendChild(box);
            }
        }

        function updateUI() {
            const count = getTodayCount();
            const countDisplay = document.getElementById('countDisplay');
            const statusIcon = document.getElementById('statusIcon');

            countDisplay.innerText = count;

            if (count <= 20) {
                countDisplay.className = 'count-display green';
                statusIcon.innerText = '✅';
            } else {
                countDisplay.className = 'count-display red';
                statusIcon.innerText = '❌';
            }

            // 更新健康小人网格
            renderHealthGrid(count);
        }

        function toggleHistory() {
            const container = document.getElementById('historyContainer');
            if (container.style.display === 'block') {
                container.style.display = 'none';
            } else {
                container.style.display = 'block';
                renderHistory();
            }
        }

        function renderHistory() {
            const data = getHistoryData();
            const listContainer = document.getElementById('historyList');
            listContainer.innerHTML = '';

            const labels = [];
            const chartData = [];
            const bgColors = [];
            
            const todayStr = getSmokingDay();
            const baseDate = new Date(todayStr);

            for (let i = 29; i >= 0; i--) {
                const d = new Date(baseDate);
                d.setDate(d.getDate() - i);
                
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dateKey = `${yyyy}-${mm}-${dd}`;
                const displayDate = `${mm}-${dd}`;

                const count = data[dateKey] || 0;
                
                labels.push(displayDate);
                chartData.push(count);
                bgColors.push(count > 20 ? '#F44336' : '#4CAF50'); 
            }

            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChart) {
                trendChart.data.labels = labels;
                trendChart.data.datasets[0].data = chartData;
                trendChart.data.datasets[0].backgroundColor = bgColors;
                trendChart.update();
            } else {
                trendChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '抽烟数量',
                            data: chartData,
                            backgroundColor: bgColors,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { 
                                beginAtZero: true,
                                suggestedMax: 25
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return context.raw + ' 支';
                                    }
                                }
                            }
                        }
                    }
                });
            }

            const sortedDates = Object.keys(data).sort((a, b) => b.localeCompare(a));
            if (sortedDates.length === 0) {
                listContainer.innerHTML = '<div class="history-item" style="justify-content:center; color:#999;">暂无历史记录</div>';
                return;
            }

            const displayDates = sortedDates.slice(0, 90);
            displayDates.forEach(date => {
                const count = data[date];
                const isGreen = count <= 20;
                const icon = isGreen ? '✅' : '❌';
                const colorClass = isGreen ? 'green' : 'red';

                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span class="history-date">${date}</span>
                    <span class="history-val ${colorClass}">${count} 支 ${icon}</span>
                `;
                listContainer.appendChild(item);
            });
        }

        initPastSuccessRecords();
        updateUI();

        document.addEventListener("visibilitychange", function() {
            if (!document.hidden) {
                updateUI();
                if (document.getElementById('historyContainer').style.display === 'block') {
                    renderHistory();
                }
            }
        });
    </script>
</body>
</html>
